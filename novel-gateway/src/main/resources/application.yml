server:
  port: 8888
spring:
  profiles:
    active: dev
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    # 网关路由：按 URL 前缀把请求转发到对应的业务微服务（lb:// 走 Nacos 服务发现 + 客户端负载均衡）
    # 前端统一访问 http://127.0.0.1:8888，由这里按 /api/xxx 前缀分发到不同服务
    gateway:
      routes:
        - id: novel-home-front
          uri: lb://novel-home-service
          predicates:
            - Path=/api/front/home/**
        - id: novel-news-front
          uri: lb://novel-news-service
          predicates:
            - Path=/api/front/news/**
        - id: novel-resource-front
          uri: lb://novel-resource-service
          predicates:
            - Path=/api/front/resource/**
        - id: novel-resource-image
          uri: lb://novel-resource-service
          predicates:
            - Path=/image/**
        - id: novel-user-front
          uri: lb://novel-user-service
          predicates:
            - Path=/api/front/user/**
        - id: novel-book-front
          uri: lb://novel-book-service
          predicates:
            - Path=/api/front/book/**
        - id: novel-search-front
          uri: lb://novel-search-service
          predicates:
            - Path=/api/front/search/**
        - id: novel-author
          uri: lb://novel-author-service
          predicates:
            - Path=/api/author/**

# Actuator 端点管理
management:
  # 端点公开配置
  endpoints:
    # 通过 HTTP 公开的 Web 端点
    web:
      exposure:
        # 只开放健康检查与指标。早期这里是 "*"，会把 env / beans / heapdump 一起暴露，
        # env 含明文口令、heapdump 可还原堆内敏感数据，属于明确的安全风险。
        # 与 application-common.yml 保持一致；需要全量端点时用独立 profile 放开并加鉴权。
        include: health,info,metrics
  # 端点启用配置
  endpoint:
    logfile:
      # 启用返回日志文件内容的端点
      enabled: true
      # 外部日志文件路径
      external-file: logs/novel-gateway.log
  info:
    env:
      # 公开所有以 info. 开头的环境属性
      enabled: true
